<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Date Time — הזמנה אישית">
<title>Date Time ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#671e52,#120712);color:#fff;font-family:Arial,sans-serif;padding:18px;overflow-x:hidden}.card{position:relative;z-index:2;width:min(680px,100%);padding:28px;text-align:center;border-radius:30px;background:#fff1;border:1px solid #fff2;backdrop-filter:blur(16px);box-shadow:0 30px 90px #0009}.title{font-size:clamp(32px,8vw,52px);font-weight:800}.msg{font-size:20px;line-height:1.6;min-height:70px;color:#eee}.buttons{display:flex;justify-content:center;gap:12px;min-height:75px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:14px 27px;font-size:18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.yes{background:#ff4f9a;color:#fff}.no{background:#ffffff15;color:#fff;border:1px solid #fff3}.hidden{display:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.choice{padding:14px;border-radius:14px;background:#0004;color:#fff;border:1px solid #fff2;cursor:pointer}.selected{outline:2px solid #ff4f9a;background:#ff4f9a22}.panel{text-align:right;margin-top:20px}input,textarea{width:100%;padding:13px;margin:7px 0 14px;border-radius:13px;border:1px solid #fff3;background:#0004;color:#fff;font-size:16px}textarea{min-height:100px}.flower{font-size:58px}.success{font-size:24px;line-height:1.8}.decline{font-size:22px;line-height:1.7;color:#eee}.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up linear infinite;opacity:.7}@keyframes up{to{transform:translateY(-110vh);opacity:0}}@media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:22px}}
</style></head>
<body><div id="hearts" aria-hidden="true"></div><main class="card">
<section id="one"><div class="title">יש לי שאלה... ❤️</div><div id="message" class="msg">רגע קטן, שאלה קטנה, אולי תשובה גדולה.</div><div class="buttons"><button class="btn yes" id="yesBtn">כן ❤️</button><button class="btn no" id="noBtn">לא 😅</button></div></section>
<section id="declined" class="hidden"><div class="flower">🌷</div><div class="title">הכול בסדר ❤️</div><div class="decline">תודה על הכנות. אין שום לחץ — אפשר לסגור את הדף.</div></section>
<section id="two" class="hidden"><div class="flower">🌹🌷🌸🌹</div><div class="title">מעולה! ❤️</div><div class="msg">בואי נבחר איך ייראה הדייט.</div><div class="panel"><b>סוג דייט</b><div class="choices"><button class="choice" data-type="ארוחת ערב">🍽️ ארוחת ערב</button><button class="choice" data-type="קפה ושיחה">☕ קפה ושיחה</button><button class="choice" data-type="הליכה בשקיעה">🌅 הליכה בשקיעה</button><button class="choice" data-type="הפתעה">🎁 הפתעה</button></div><label for="date"><b>תאריך</b></label><input id="date" type="date"><label for="time"><b>שעה</b></label><input id="time" type="time"><label for="note"><b>הערה</b></label><textarea id="note" maxlength="500" placeholder="משהו קטן שתרצי להוסיף..."></textarea><button class="btn yes" id="confirmBtn" style="width:100%">אישור ❤️</button></div></section>
<section id="three" class="hidden"><div class="flower">💐🌹💐</div><div class="title">אז יש לנו דייט! ❤️</div><div id="summary" class="success"></div></section>
</main>
<script>
const $=id=>document.getElementById(id); const id=new URLSearchParams(location.search).get('id'); let type=''; let i=0;
const phrases=['לא 😅','בטוחה?','רגע...','עוד ניסיון? 😂','אולי כן? 👀','תחשבי על זה שוב','הכפתור הזה חשוד','ניסיון אחרון 😇'];
$('noBtn').addEventListener('click',()=>{
  if(i<phrases.length){$('noBtn').textContent=phrases[i++];$('noBtn').style.transform=`translate(${Math.random()*110-55}px,${Math.random()*70-35}px)`;return;}
  $('one').classList.add('hidden'); $('declined').classList.remove('hidden');
});
$('yesBtn').addEventListener('click',()=>{$('one').classList.add('hidden');$('two').classList.remove('hidden');});
document.querySelectorAll('.choice').forEach(el=>el.addEventListener('click',()=>{type=el.dataset.type;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}));
$('confirmBtn').addEventListener('click',confirmDate);
async function confirmDate(){
  if(!id)return alert('קישור הזמנה לא תקין.'); if(!type||!$('date').value||!$('time').value)return alert('בחרי סוג דייט, תאריך ושעה ❤️');
  const selected=new Date(`${$('date').value}T${$('time').value}`); if(!Number.isFinite(selected.getTime())||selected<=new Date())return alert('בחרי תאריך ושעה עתידיים ❤️');
  $('confirmBtn').disabled=true;
  try{
    const r=await fetch('/api/invites/'+encodeURIComponent(id)+'/response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accepted:true,dateType:type,date:$('date').value,time:$('time').value,note:$('note').value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'אירעה שגיאה');
    $('two').classList.add('hidden');$('three').classList.remove('hidden');
    $('summary').textContent=`${type} | 📅 ${$('date').value} | 🕐 ${$('time').value}`;
  }catch(e){alert(e.message||'אירעה שגיאה, נסי שוב.');$('confirmBtn').disabled=false}
}
if(id){fetch('/api/invites/'+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(d.message)$('message').textContent=d.message}).catch(()=>{$('message').textContent='ההזמנה לא נמצאה.'})}
for(let j=0;j<65;j++){const h=document.createElement('div');h.className='heart';h.textContent=Math.random()>.5?'❤️':'♥';h.style.left=Math.random()*100+'%';h.style.fontSize=10+Math.random()*23+'px';h.style.animationDuration=5+Math.random()*8+'s';h.style.animationDelay=-Math.random()*10+'s';$('hearts').appendChild(h)}
</script></body></html>
