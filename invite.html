<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Time ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#671e52,#120712);color:#fff;font-family:Arial;padding:18px;overflow-x:hidden}.card{position:relative;z-index:2;width:min(680px,100%);padding:28px;text-align:center;border-radius:30px;background:#fff1;border:1px solid #fff2;backdrop-filter:blur(16px);box-shadow:0 30px 90px #0009}.title{font-size:clamp(32px,8vw,52px);font-weight:800}.msg{font-size:20px;line-height:1.6;min-height:70px;color:#eee}.buttons{display:flex;justify-content:center;gap:12px;min-height:75px}.btn{border:0;border-radius:15px;padding:14px 27px;font-size:18px;font-weight:800;cursor:pointer}.yes{background:#ff4f9a;color:#fff}.no{background:#ffffff15;color:#fff;border:1px solid #fff3}.hidden{display:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.choice{padding:14px;border-radius:14px;background:#0004;color:#fff;border:1px solid #fff2;cursor:pointer}.selected{outline:2px solid #ff4f9a;background:#ff4f9a22}.panel{text-align:right;margin-top:20px}input,textarea{width:100%;padding:13px;margin:7px 0 14px;border-radius:13px;border:1px solid #fff3;background:#0004;color:#fff;font-size:16px}.flower{font-size:58px}.success{font-size:24px;line-height:1.8}.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up linear infinite;opacity:.7}@keyframes up{to{transform:translateY(-110vh);opacity:0}}@media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:22px}}</style>
<div id="hearts"></div><main class="card"><section id="one"><div class="title">יש לי שאלה... ❤️</div><div id="message" class="msg">רגע קטן, שאלה קטנה, אולי תשובה גדולה.</div><div class="buttons"><button class="btn yes" onclick="accept()">כן ❤️</button><button class="btn no" id="noBtn" onclick="nope()">לא 😅</button></div></section>
<section id="two" class="hidden"><div class="flower">🌹🌷🌸🌹</div><div class="title">ידעתי! ❤️</div><div class="msg">בואי נבחר איך ייראה הדייט.</div><div class="panel"><b>סוג דייט</b><div class="choices"><button class="choice" onclick="pick(this,'ארוחת ערב')">🍽️ ארוחת ערב</button><button class="choice" onclick="pick(this,'קפה ושיחה')">☕ קפה ושיחה</button><button class="choice" onclick="pick(this,'הליכה בשקיעה')">🌅 הליכה בשקיעה</button><button class="choice" onclick="pick(this,'הפתעה')">🎁 הפתעה</button></div><b>תאריך</b><input id="date" type="date"><b>שעה</b><input id="time" type="time"><b>הערה</b><textarea id="note" placeholder="משהו קטן שתרצי להוסיף..."></textarea><button class="btn yes" style="width:100%" onclick="confirmDate()">אישור ❤️</button></div></section>
<section id="three" class="hidden"><div class="flower">💐🌹💐</div><div class="title">אז יש לנו דייט! ❤️</div><div id="summary" class="success"></div></section></main>
<script>const id=new URLSearchParams(location.search).get("id");let type="",i=0;const phrases=["לא 😅","בטוחה?","רגע...","עוד ניסיון? 😂","אולי כן? 👀","אני מתחיל להיעלב 😭","תחשבי על זה שוב","הכפתור הזה חשוד","ניסיון אחרון 😇"];function nope(){noBtn.textContent=phrases[i++%phrases.length];noBtn.style.transform=`translate(${Math.random()*110-55}px,${Math.random()*70-35}px)`}function accept(){one.classList.add("hidden");two.classList.remove("hidden")}function pick(el,v){type=v;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}async function confirmDate(){if(!type||!date.value||!time.value)return alert("בחרי סוג דייט, תאריך ושעה ❤️");if(new Date(`${date.value}T${time.value}`)<new Date())return alert("בחרי תאריך ושעה עתידיים ❤️");const r=await fetch("/api/invites/"+encodeURIComponent(id)+"/response",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accepted:true,dateType:type,date:date.value,time:time.value,note:note.value})});if(!r.ok)return alert("אירעה שגיאה, נסי שוב.");two.classList.add("hidden");three.classList.remove("hidden");summary.innerHTML=`${type}<br>📅 ${date.value}<br>🕐 ${time.value}<br><br>הפרטים נשמרו בהצלחה ❤️`}fetch("/api/invites/"+encodeURIComponent(id)).then(r=>r.json()).then(d=>{if(d.message)message.textContent=d.message});for(let j=0;j<65;j++){let h=document.createElement("div");h.className="heart";h.textContent=Math.random()>.5?"❤️":"♥";h.style.left=Math.random()*100+"%";h.style.fontSize=10+Math.random()*23+"px";h.style.animationDuration=5+Math.random()*8+"s";h.style.animationDelay=-Math.random()*10+"s";hearts.appendChild(h)}</script>
