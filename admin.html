<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Time Admin</title><style>body{margin:0;background:#110811;color:#fff;font-family:Arial;padding:22px}.wrap{max-width:1000px;margin:auto}.card{background:#fff1;border:1px solid #fff2;border-radius:18px;padding:18px;margin:12px 0}.top{display:flex;gap:8px}.top input{flex:1}input,button{padding:11px;border-radius:10px;border:0}button{cursor:pointer}.muted{color:#aaa}</style><div class="wrap"><h1>Date Time — Admin ❤️</h1><div class="top"><input id="token" type="password" placeholder="Admin token"><button onclick="load()">כניסה</button></div><div id="list"></div></div><script>async function load(){const r=await fetch("/api/admin/invites",{headers:{"x-admin-token":token.value}});const a=await r.json();if(!r.ok){list.innerHTML="<p>אין הרשאה.</p>";return}list.innerHTML=a.map(x=>`<div class="card"><b>${x.status==="confirmed"?"✅ אושר":"📨 נשלח"}</b><div class="muted">${x.createdAt}</div><p>${x.message||""}</p><p>${x.dateType||"—"} | ${x.date||"—"} | ${x.time||"—"}</p><p>${x.note||""}</p><small>${location.origin}/invite.html?id=${x.id}</small></div>`).join("")||"<p>אין הזמנות.</p>"}</script>
