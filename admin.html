<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Date Time Admin</title>
<style>body{margin:0;background:#110811;color:#fff;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:1000px;margin:auto}.card{background:#fff1;border:1px solid #fff2;border-radius:18px;padding:18px;margin:12px 0}.top{display:flex;gap:8px}.top input{flex:1}input,button{padding:11px;border-radius:10px;border:0}button{cursor:pointer}.muted{color:#aaa}.error{color:#ffd1d1}.row{margin-top:8px}</style></head>
<body><div class="wrap"><h1>Date Time — Admin</h1><div class="top"><input id="token" type="password" autocomplete="current-password" placeholder="Admin token"><button id="login">כניסה</button></div><div id="list"></div></div>
<script>
const $=id=>document.getElementById(id); $('login').addEventListener('click',load);
function addRow(card,label,value){const p=document.createElement('p');p.className='row';p.textContent=`${label}: ${value||'—'}`;card.appendChild(p)}
async function load(){
  const list=$('list'); list.replaceChildren();
  try{const r=await fetch('/api/admin/invites',{headers:{'x-admin-token':$('token').value}});const a=await r.json();if(!r.ok)throw new Error('אין הרשאה.');
    if(!a.length){list.textContent='אין הזמנות.';return;}
    for(const x of a){const card=document.createElement('div');card.className='card';
      const status=document.createElement('b');status.textContent=x.status==='confirmed'?'✅ אושר':'📨 נשלח';card.appendChild(status);
      addRow(card,'שם',x.name);addRow(card,'נוצר',x.createdAt);addRow(card,'הודעה',x.message);addRow(card,'סוג דייט',x.dateType);addRow(card,'תאריך',x.date);addRow(card,'שעה',x.time);addRow(card,'הערה',x.note);
      const link=document.createElement('a');link.href=`${location.origin}/invite.html?id=${encodeURIComponent(x.id)}`;link.target='_blank';link.rel='noopener';link.textContent='פתח הזמנה';link.style.color='#ffb4d2';card.appendChild(link);list.appendChild(card);
    }
  }catch(e){const p=document.createElement('p');p.className='error';p.textContent=e.message||'שגיאה';list.appendChild(p)}
}
</script></body></html>
