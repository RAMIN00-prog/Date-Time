<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Date Time — יצירת הזמנה אישית לדייט">
<title>Date Time ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#601d50,#100712);color:#fff;font-family:Arial,sans-serif;padding:20px}.card{width:min(620px,100%);padding:30px;border-radius:28px;background:#fff1;border:1px solid #fff2;box-shadow:0 30px 90px #0008}h1{text-align:center;font-size:42px}p{text-align:center;color:#ddd}label{display:block;margin-top:16px}input,textarea{width:100%;margin-top:7px;padding:14px;border-radius:13px;border:1px solid #fff3;background:#0004;color:#fff;font-size:16px}textarea{min-height:120px}.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#ff4f9a;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:15px;background:#0005;border-radius:13px;word-break:break-word}.result a{color:#ffb4d2}.error{color:#ffd1d1}</style>
</head>
<body><main class="card"><h1>Date Time ❤️</h1><p>יצירת הזמנה אישית</p><label for="name">שם</label><input id="name" maxlength="80" placeholder="שם שיופיע בהזמנה"><label for="message">הודעה אישית</label><textarea id="message" maxlength="500" placeholder="יש לי שאלה קטנה אלייך... ❤️"></textarea><button class="btn" id="createBtn">צור הזמנה 💌</button><div id="result" class="result" hidden></div></main>
<script>
const $=id=>document.getElementById(id);
$('createBtn').addEventListener('click', createInvite);
async function createInvite(){
  const name=$('name').value.trim(), message=$('message').value.trim(), result=$('result'), btn=$('createBtn');
  if(!name){result.hidden=false;result.className='result error';result.textContent='נא למלא שם.';return;}
  btn.disabled=true; result.hidden=false; result.className='result'; result.textContent='יוצר הזמנה...';
  try{
    const r=await fetch('/api/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,message})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'שגיאה');
    const u=new URL(d.url,location.origin);
    result.replaceChildren(document.createTextNode('ההזמנה מוכנה ❤️\n'));
    const a=document.createElement('a'); a.href=u.href; a.target='_blank'; a.rel='noopener'; a.textContent=u.href; result.appendChild(a);
  }catch(e){result.className='result error';result.textContent=e.message||'אירעה שגיאה.'}
  finally{btn.disabled=false}
}
</script></body></html>
