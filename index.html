<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Time ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#601d50,#100712);color:#fff;font-family:Arial;padding:20px}.card{width:min(620px,100%);padding:30px;border-radius:28px;background:#fff1;border:1px solid #fff2;box-shadow:0 30px 90px #0008}h1{text-align:center;font-size:42px}p{text-align:center;color:#ddd}label{display:block;margin-top:16px}input,textarea{width:100%;margin-top:7px;padding:14px;border-radius:13px;border:1px solid #fff3;background:#0004;color:#fff;font-size:16px}textarea{min-height:120px}.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#ff4f9a;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:15px;background:#0005;border-radius:13px;word-break:break-all}.result a{color:#ffb4d2}</style>
<main class="card"><h1>Date Time ❤️</h1><p>יצירת הזמנה אישית</p><label>שם</label><input id="name" placeholder="שם שיופיע בהזמנה"><label>הודעה אישית</label><textarea id="message" placeholder="יש לי שאלה קטנה אלייך... ❤️"></textarea><button class="btn" onclick="createInvite()">צור הזמנה 💌</button><div id="result" class="result" hidden></div></main>
<script>async function createInvite(){result.hidden=false;result.textContent="יוצר הזמנה...";try{const r=await fetch("/api/invites",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,message:message.value})});const d=await r.json();if(!r.ok)throw Error(d.error||"שגיאה");const u=location.origin+d.url;result.innerHTML=`ההזמנה מוכנה ❤️<br><a href="${d.url}" target="_blank">${u}</a>`}catch(e){result.textContent=e.message}}</script>
