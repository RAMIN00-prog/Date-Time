services:
  - type: web
    name: date-time
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: date-time-db
          property: connectionString

databases:
  - name: date-time-db
    plan: free
    region: frankfurt
    databaseName: date_time
    user: date_time
    diskSizeGB: 1
